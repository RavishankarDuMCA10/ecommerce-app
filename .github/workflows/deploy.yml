# Workflow: Builds, packages, and deploys app to AWS ECS
name: Deploy Application

# Trigger: Runs on any push to main branch
on:
  push:
    branches:
      - main

jobs:
  deploy-app:
    # Runner: Ubuntu for Docker compatibility
    runs-on: ubuntu-latest
    steps:
      # Checkout code from repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Verify Dockerfiles exist
      - name: Check app directories
        run: |
          ls -l frontend/Dockerfile || echo "Error: Frontend Dockerfile not found"
          ls -l backend/Dockerfile || echo "Error: Backend Dockerfile not found"
          if [ ! -f frontend/Dockerfile ] || [ ! -f backend/Dockerfile ]; then exit 1; fi

      # Configure AWS credentials for ECR and ECS access
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Log in to Amazon ECR
      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

      # Package frontend image
      - name: Package frontend image
        run: |
          docker build -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/my-app-repo:frontend-latest frontend
          docker images | grep my-app-repo | grep frontend-latest
          echo "Frontend image packaged"

      # Package backend image
      - name: Package backend image
        run: |
          docker build -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/my-app-repo:backend-latest backend
          docker images | grep my-app-repo | grep backend-latest
          echo "Backend image packaged"

      # Push images to ECR
      - name: Push images to ECR
        run: |
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/my-app-repo:frontend-latest
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/my-app-repo:backend-latest

      # Inject real values into task definitions and register them with ECS
      - name: Register backend task definition
        run: |
          sed -e "s|BACKEND_IMAGE|${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/my-app-repo:backend-latest|g" \
              -e "s|ACCOUNT_ID_PLACEHOLDER|${{ secrets.AWS_ACCOUNT_ID }}|g" \
              backend/ecs-task-definition.json > /tmp/backend-task-def.json
          aws ecs register-task-definition --cli-input-json file:///tmp/backend-task-def.json --region us-east-1

      - name: Register frontend task definition
        run: |
          sed -e "s|FRONTEND_IMAGE|${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/my-app-repo:frontend-latest|g" \
              -e "s|ACCOUNT_ID_PLACEHOLDER|${{ secrets.AWS_ACCOUNT_ID }}|g" \
              frontend/ecs-task-definition.json > /tmp/frontend-task-def.json
          aws ecs register-task-definition --cli-input-json file:///tmp/frontend-task-def.json --region us-east-1

      # Deploy new task definition revisions to ECS services
      - name: Update ECS services
        run: |
          BACKEND_TASK_DEF=$(aws ecs describe-task-definition --task-definition ecommerce-backend --query 'taskDefinition.taskDefinitionArn' --output text --region us-east-1)
          FRONTEND_TASK_DEF=$(aws ecs describe-task-definition --task-definition ecommerce-frontend --query 'taskDefinition.taskDefinitionArn' --output text --region us-east-1)
          aws ecs update-service --cluster my-ecs-cluster --service backend-service --task-definition $BACKEND_TASK_DEF --desired-count 1 --force-new-deployment --region us-east-1
          aws ecs update-service --cluster my-ecs-cluster --service frontend-service --task-definition $FRONTEND_TASK_DEF --desired-count 1 --force-new-deployment --region us-east-1

      # Wait for both services to finish deploying
      - name: Wait for ECS services to stabilize
        run: |
          aws ecs wait services-stable --cluster my-ecs-cluster --services frontend-service backend-service --region us-east-1
